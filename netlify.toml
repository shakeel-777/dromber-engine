[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy.html"
  status = 301

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/terms-of-service"
  to = "/terms.html"
  status = 301

[[redirects]]
  from = "/disclaimer"
  to = "/disclaimer.html"
  status = 200

[[redirects]]
  from = "/refund"
  to = "/terms.html#refunds"
  status = 301

[[redirects]]
  from = "/shipping"
  to = "/terms.html#delivery"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/terms.html#contact"
  status = 301

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/.env*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/dev_server.py"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/strix_runs/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/progress.txt"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/*.bak"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/*.backup*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/*.pre_*"
  to = "/"
  status = 404
  force = true


[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://checkout.razorpay.com https://cdn.razorpay.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com https://checkout.razorpay.com https://api.emailjs.com; frame-src https://api.razorpay.com https://checkout.razorpay.com;"
